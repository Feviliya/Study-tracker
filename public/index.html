    @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

const COURSES = ['Polity','History','Geography','Economics','Science & Tech','Environment','Current Affairs','Sociology','Ethics','CSAT','Art & Culture'];
const SUBJECTS_MAP = {
  'Polity': ['Indian Constitution','Parliament','Judiciary','Executive','Federalism','Local Govt','Elections','Emergency Provisions'],
  'History': ['Ancient India','Medieval India','Modern India','World History','Post-Independence'],
  'Geography': ['Physical Geography','Indian Geography','World Geography','Economic Geography','Human Geography'],
  'Economics': ['Macroeconomics','Microeconomics','Indian Economy','Budget & Finance','Banking','Agriculture'],
  'Science & Tech': ['Physics','Chemistry','Biology','Technology','Space & Defence','Health & Medicine'],
  'Environment': ['Ecology','Biodiversity','Climate Change','Env. Laws & Agreements','Pollution','Conservation'],
  'Current Affairs': ['National','International','Economy','Science & Tech','Sports','Awards','Schemes & Policies'],
  'Sociology' : ['Paper I', 'Paper II'],
  'Ethics': ['Ethical Theory','Integrity & Values','Case Studies','Public Service Ethics','Corporate Ethics'],
  'CSAT': ['Reading Comprehension','Quantitative Aptitude','Logical Reasoning','Data Interpretation'],
  'Art & Culture': ['Architecture','Literature','Music & Dance','Paintings','Festivals','Philosophy'],
};
const ACTIVITY_TYPES = ['Study','Revision','Test Practice','Note-Making','Mock Interview','Group Discussion'];
const COURSE_COLORS = ['#3b82f6','#8b5cf6','#22c55e','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16','#f97316','#a78bfa'];

// ═══════════════════════════════════════════
//   HELPERS
// ═══════════════════════════════════════════
const fmtMins = (m) => {
  m = parseInt(m) || 0;
  const h = Math.floor(m / 60), min = m % 60;
  if (h > 0 && min > 0) return `${h}h ${min}m`;
  if (h > 0) return `${h}h`;
  return `${min}m`;
};
const fmtSecs = (s) => {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
};// NEW — uses local date, not UTC
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => localDateStr(new Date());
const weekDatesArr = () => {
  const now = new Date(), dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - ((dow+6)%7));
  return Array.from({length:7}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return localDateStr(d); });
};
const calcStreak = (acts) => {
  const dates = new Set(acts.map(a=>a.date));
  let streak=0, d=new Date();
  while(dates.has(localDateStr(d))) { streak++; d.setDate(d.getDate()-1); }
  return streak;
};

const minsForDate = (acts, date) => acts.filter(a=>a.date===date).reduce((s,a)=>s+(parseInt(a.duration)||0),0);

const genId = () => `${Date.now()}_${Math.random().toString(36).slice(2,7)}`;

const NavItem = ({icon, label, active, onClick}) => (
  <div onClick={onClick} className="nav-item" style={{
    display:'flex', alignItems:'center', gap:12, padding:'9px 14px',

    {active && <span style={{marginLeft:'auto', width:6, height:6, borderRadius:'50%', background:'#3b82f6'}} />}
  </div>
);

const DonutChart = React.memo(({data}) => {
  const ref = React.useRef(null);
  const chart = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();
    const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]);
    if (!entries.length) return;
    chart.current = new Chart(ref.current, {
      type:'doughnut',
      data: {
        labels: entries.map(([k])=>k),
        datasets:[{
          data: entries.map(([,v])=>v),
          backgroundColor: COURSE_COLORS.slice(0,entries.length),
          borderWidth:0, hoverBorderWidth:3, hoverBorderColor:'#fff'
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'75%',
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:(c)=>` ${c.label}: ${fmtMins(c.raw)}`}}
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  }, [JSON.stringify(data)]);
  return <div className="chart-container"  style={{position:'relative',height:170}}><canvas ref={ref} role="img" aria-label="Study hours by course" /></div>;
});

const WeekChart = React.memo(({weekData}) => {
  const ref = React.useRef(null);
  const chart = React.useRef(null);
  React.useEffect(()=>{
    if(!ref.current) return;
    if(chart.current) chart.current.destroy();
    chart.current = new Chart(ref.current, {
      type:'line',
      data:{
        labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[{
          data: weekData.map(m => parseFloat((m/60).toFixed(2))),
          borderColor:'#3b82f6',
          backgroundColor:'rgba(59,130,246,0.08)',
          borderWidth:2.5, fill:true, tension:0.4,
          pointRadius:5, pointBackgroundColor:'#3b82f6',
          pointBorderColor:'#1a2035', pointBorderWidth:2.5,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>` ${fmtMins(Math.round(c.raw*60))}`}}},
        scales:{
          x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#4b5563',font:{size:11,family:'Sora'}}},
          y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#4b5563',font:{size:11,family:'Sora'},callback:v=>`${v}h`},beginAtZero:true}
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[JSON.stringify(weekData)]);
  return <div style={{position:'relative',height:130}}><canvas ref={ref} role="img" aria-label="Weekly study hours" /></div>;
});

const StreakRow = ({activities}) => {
  const week = weekDatesArr();
  const t = todayStr();
  const active = new Set(activities.map(a=>a.date));
  return (
    <div style={{display:'flex', gap:6, marginTop:12}}>
      {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((day,i)=>{
        const date = week[i];
        const restDay = activities.some(
          a =>
            a.date === date &&
            a.type === 'Rest Day'
        );
        const done = active.has(date);
        const past = date < t;
        const isToday = date === t;
        return (
          <div key={day} style={{flex:1, textAlign:'center'}}>
            <div style={{fontSize:10.5, color:'#4b5563', marginBottom:6, letterSpacing:0.3}}>{day}</div>
            <div style={{
              width:32, height:32, borderRadius:'50%', margin:'0 auto',
              display:'flex', alignItems:'center', justifyContent:'center',
              background: done ? '#16a34a' : 'transparent',
              border: isToday && !done ? '2px solid #3b82f6' : past && !done ? '1.5px solid #1e2d40' : done ? 'none' : '1.5px dashed #1e2d40',
              fontSize:14, color: done ? '#fff' : '#374151',
              transition:'all 0.2s',
            }}>
              {
                restDay
                  ? '🦉'
                  : done
                    ? '✓'
                    : past
                      ? '✗'
                      : isToday
                        ? '·'
                        : ''
              }
            </div>
          </div>
        );
      })}
    </div>
  );
};

const Toast = ({msg}) => <div className="toast">✓ {msg}</div>;

        </div>
      </div>

// ═══════════════════════════════════════════
//   TIMER WIDGET
// ═══════════════════════════════════════════
const TimerWidget = ({onLog}) => {
  const [running, setRunning] = React.useState(false);
  const [secs, setSecs] = React.useState(0);
  const [course, setCourse] = React.useState('Polity');
  const [subject, setSubject] = React.useState('');
  const intRef = React.useRef(null);
  const startRef = React.useRef(null);

  React.useEffect(()=>{
    if(running){
      startRef.current = new Date();
      intRef.current = setInterval(()=>setSecs(s=>s+1), 1000);
    } else { clearInterval(intRef.current); }
    return ()=>clearInterval(intRef.current);
  },[running]);

  const handleSave = () => {
    if(secs < 30) return;
    const dur = Math.round(secs/60);
    const st = startRef.current;
    onLog({
      date: todayStr(), type:'Study', course, subject, topic:'',
      startTime:`${String(st.getHours()).padStart(2,'0')}:${String(st.getMinutes()).padStart(2,'0')}`,
      duration: dur,
    });

          style={{flex:1, background: running ? '#d97706' : '#16a34a'}}>

};

                      }}>

                        <div>
                          <div style={{
                            fontSize:14,
                            fontWeight:700,
                            color:'#e2e8f0'
                          }}>
                             Calendar view
                          </div>
                        </div>

                        <div style={{
                          display:'flex',
                          alignItems:'center',
                          gap:10
                        }}>

                          <button
                            className="btn-ghost"
                            style={{padding:'5px 10px'}}
                            onClick={()=>{
                              const d = new Date(calendarDate);
                              d.setMonth(d.getMonth()-1);
                              setCalendarDate(d);
                            }}
                          >
                            ←
                          </button>

                          <div style={{
                            minWidth:140,
                            textAlign:'center',
                            fontSize:13,
                            fontWeight:600,
                            color:'#e2e8f0'
                          }}>
                            {monthName} {year}
                          </div>

                          <button
                            className="btn-ghost"
                            style={{padding:'5px 10px'}}
                            onClick={()=>{
                              const d = new Date(calendarDate);
                              d.setMonth(d.getMonth()+1);
                              setCalendarDate(d);
                            }}
                          >
                            →
                          </button>

                        </div>
                      </div>

                      {/* Week Names */}
                      <div style={{
                        display:'grid',
                        gridTemplateColumns:'repeat(7,1fr)',
                        gap:8,
                        marginBottom:8
                      }}>
                        {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day=>(
                          <div
                            key={day}
                            style={{
                              textAlign:'center',
                              fontSize:11,
                              color:'#64748b',
                              fontWeight:600
                            }}
                          >
                            {day}
                          </div>
                        ))}
                      </div>

                      {/* Calendar Grid */}
                      <div style={{
                        display:'grid',
                        gridTemplateColumns:'repeat(7,1fr)',
                        gap:8
                      }}>
                        {cells.map((dateObj,idx)=>{

                          if(!dateObj){
                            return (
                              <div
                                key={idx}
                                style={{
                                  aspectRatio:'1',
                                  borderRadius:10
                                }}
                              />
                            );
                          }
                          
                          const ds = dateObj.toLocaleDateString('en-CA');
                          const isRestDay = acts.some(
                            a =>
                              a.date === ds &&
                              a.type === 'Rest Day'
                          );
                          const mins = minsForDate(acts, ds);

                          const stars = getStars(mins);

                          const bg = isRestDay ? '#6366f1' : getBg(stars);

                          const isToday = ds === todayStr();

                          return (
                            <div
                              key={ds}
                              title={`${dateObj.toDateString()}
                                ${stars}★ Productivity
                                ${fmtMins(mins)} studied`}
                              style={{
                                aspectRatio:'1',
                                borderRadius:12,
                                background:bg,
                                border:isToday
                                  ? '2px solid #60a5fa'
                                  : '1px solid #1e2d40',
                                display:'flex',
                                flexDirection:'column',
                                alignItems:'center',
                                justifyContent:'center',
                                cursor:'pointer',
                                transition:'all 0.18s ease',
                                position:'relative'
                              }}
                              onMouseEnter={(e)=>{
                                e.currentTarget.style.transform='scale(1.06)';
                              }}
                              onMouseLeave={(e)=>{
                                e.currentTarget.style.transform='scale(1)';
                              }}
                            >

                              <div style={{
                                fontSize:13,
                                fontWeight:700,
                                color:'#fff'
                              }}>
                                {dateObj.getDate()}
                              </div>

                              <div style={{
                                fontSize:9,
                                marginTop:4,
                                color:'rgba(255,255,255,0.85)'
                              }}>
                                {isRestDay? '🦉': '★'.repeat(stars)}
                              </div>

                            </div>
                          );

                        })}
                      </div>

                      {/* Legend */}
                      <div style={{
                        display:'flex',
                        gap:12,
                        marginTop:16,
                        flexWrap:'wrap',
                        fontSize:11
                      }}>
                        {[
                          ['#22c55e','Excellent'],
                          ['#84cc16','Great'],
                          ['#eab308','Good'],
                          ['#f97316','Low'],
                          ['#ef4444','Very Low'],
                          ['#0f172a','No Study'],
                        ].map(([c,l])=>(
                          <div
                            key={l}
                            style={{
                              display:'flex',
                              alignItems:'center',
                              gap:6
                            }}
                          >
                            <div style={{
                              width:11,
                              height:11,
                              borderRadius:4,
                              background:c
                            }} />

                            <span style={{color:'#94a3b8'}}>
                              {l}
                            </span>
                          </div>
                        ))}
                      </div>

                    </>
                  );

                })()}

              </div>
            </div>

            {/* ═══ COLUMN 3 ═══ */}
            <div style={{display:'flex', flexDirection:'column', gap:16}}>

              {/* Study Days */}
              <div className="card" style={{padding:18}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
                  <span style={{fontSize:13.5, fontWeight:600, color:'#e2e8f0'}}>📅 Study Days</span>
                  <span style={{fontSize:13, color:'#3b82f6', fontWeight:700}}>{uniqueDays} / {goal.studyDayTarget}</span>
                </div>
                <div style={{display:'flex', gap:4, marginBottom:14}}>
                  {['insights','pace','exams'].map(t=>(
                    <button key={t} className={`tab-btn ${daysTab===t?'active':''}`} onClick={()=>setDaysTab(t)} style={{flex:1}}>
                      {t.charAt(0).toUpperCase()+t.slice(1)}
                    </button>
                  ))}
                </div>

                {daysTab==='insights' && (
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    {[
                      ['Active days', `${uniqueDays} / ${goal.studyDayTarget}`, '#3b82f6', `${Math.round(uniqueDays/Math.max(1,goal.studyDayTarget)*100)}% done`],
                      ['Best streak', streak + ' days', '#f97316', 'current streak'],
                      ['Daily avg', fmtMins(uniqueDays>0?Math.round(totalMins/uniqueDays):0), '#a78bfa', 'active days only'],
                      ['Days left', daysLeft, daysLeft<30?'#ef4444':daysLeft<90?'#f59e0b':'#22c55e', 'to exam'],
                    ].map(([l,v,c,sub])=>(
                      <div key={l} className="mini-stat">
                        <div style={{fontSize:10.5, color:'#4b5563', marginBottom:3}}>{l}</div>
                        <div style={{fontSize:19, fontWeight:700, color:c, lineHeight:1.2}}>{v}</div>
                        <div style={{fontSize:10, color:'#374151', marginTop:2}}>{sub}</div>
                      </div>
                    ))}
                  </div>
                )}

                {daysTab==='pace' && (
                  <div style={{display:'flex', flexDirection:'column', gap:10}}>
                    {[
                      ['Required pace', daysLeft>0?`${fmtMins(Math.ceil((goal.studyDayTarget-uniqueDays)/Math.max(1,daysLeft)*goalMins))} / day`:'—', '#f59e0b'],
                      ['Current pace', uniqueDays>0?`${fmtMins(Math.round(totalMins/Math.max(1,uniqueDays)))} / day`:'—', '#22c55e'],
                      // ['Study days pct', `${Math.round(uniqueDays/Math.max(1,goal.studyDayTarget)*100)}%`, '#3b82f6'],
                      ['Goal completion', `${dayPct}% today`, '#a78bfa'],
                    ].map(([l,v,c])=>(
                      <div key={l} className="mini-stat" style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px'}}>
                        <span style={{fontSize:12, color:'#64748b'}}>{l}</span>
                        <span style={{fontSize:15, fontWeight:700, color:c}}>{v}</span>
                      </div>
                    ))}
                  </div>
                )}

                {daysTab==='exams' && (
                  <div style={{display:'flex', flexDirection:'column', gap:8}}>
                    {exams.map(({name,date})=>{
                      const d = Math.max(0, Math.ceil((new Date(date)-new Date())/864e5));
                      const color = d<30?'#ef4444':d<90?'#f59e0b':'#22c55e';
                      return (
                        <div key={name} style={{background:'#0f172a', borderRadius:8, padding:'11px 14px', display:'flex', alignItems:'center', justifyContent:'space-between', border:'1px solid #1e2d40'}}>
                          <div>
                            <div style={{fontSize:12.5, fontWeight:500, color:'#e2e8f0'}}>{name}</div>
                            <div style={{fontSize:11, color:'#4b5563', marginTop:2}}>{new Date(date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
                          </div>
                          <div style={{textAlign:'right'}}>
                            <div style={{fontSize:20, fontWeight:800, color, lineHeight:1}}>{d}</div>
                            <div style={{fontSize:10, color:'#4b5563'}}>days</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Recent Activities */}
              <div className="card" style={{padding:18, flex:1, display:'flex', flexDirection:'column'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
                  <span style={{fontSize:13.5, fontWeight:600, color:'#e2e8f0'}}>📋 Activities</span>
                  <button className="btn-ghost" onClick={()=>setShowAdd(true)} style={{padding:'5px 10px', fontSize:12}}>+ Add</button>
                </div>

                {recent.length===0 ? (
                  <div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'28px 0'}}>
                    <div style={{fontSize:34, marginBottom:10}}>📝</div>
                    <div style={{fontSize:13, color:'#4b5563', textAlign:'center', lineHeight:1.6}}>
                      No sessions logged yet.<br />
                      <span style={{color:'#3b82f6', cursor:'pointer'}} onClick={()=>setShowAdd(true)}>Start your first session →</span>
                    </div>
                  </div>
                ) : (
                  <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:7}}>
                    {recent.map(a=>{
                      const typeColor = {Study:'#3b82f6','Revision':'#8b5cf6','Test Practice':'#ef4444','Note-Making':'#22c55e','Mock Interview':'#f59e0b','Group Discussion':'#06b6d4'}[a.type]||'#3b82f6';
                      return (
                        <div key={a.id} className="activity-row">
                          <div style={{width:8, height:8, borderRadius:'50%', flexShrink:0, background:typeColor}} />
                          <div style={{flex:1, minWidth:0}}>
                            <div style={{fontSize:12.5, fontWeight:500, color:'#e2e8f0', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                              {a.course}{a.subject?` · ${a.subject}`:''}
                            </div>
                            <div style={{fontSize:11, color:'#374151', marginTop:2}}>
                              {a.date} {a.startTime && `· ${a.startTime}`}
                              {a.type && <span style={{color:typeColor, marginLeft:4, opacity:0.8}}>· {a.type}</span>}
                            </div>
                          </div>
                          <span style={{fontSize:12, fontWeight:700, color:'#22c55e', flexShrink:0}}>{fmtMins(a.duration)}</span>
                          <button className="delete-btn" onClick={()=>delActivity(a.id)} title="Delete">×</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Firebase setup notice */}
          {!db && (
            <div style={{
              marginTop:18, padding:'12px 18px', background:'rgba(59,130,246,0.07)',
              border:'1px solid rgba(59,130,246,0.2)', borderRadius:10,
              fontSize:12.5, color:'#93c5fd', display:'flex', alignItems:'center', gap:10,
            }}>
              <span style={{fontSize:18}}>☁️</span>
              <span><strong>Local mode active.</strong> Data is saved in your browser. To sync across devices, add your Firebase config to the <code>FIREBASE_CONFIG</code> object at the top of this file, then deploy to Firebase Hosting.</span>
            </div>
          )}
        </main>
      </div>

      {showAdd && <AddModal onClose={()=>setShowAdd(false)} onSave={addActivity} />}
      {showGoal && <GoalModal goal={goal} onClose={()=>setShowGoal(false)} onSave={saveGoal} />}
      {toast && <Toast msg={toast} />}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
